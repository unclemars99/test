name: E000-D invariance SSL baseline

on:
  push:
    branches: [ master ]
    paths:
      - 'src/e000d_vicreg_ssl.py'
      - '.github/workflows/e000d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-e000d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn tabulate
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run E000-D
        run: python src/e000d_vicreg_ssl.py

      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/e000d
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record E000-D invariance SSL results"
            git push
          fi
